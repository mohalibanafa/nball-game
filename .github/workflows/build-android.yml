name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Release Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/android/app/release.keystore"
          else
            echo "No secrets keystore found. Generating fallback..."
            keytool -genkey -v -keystore "${{ github.workspace }}/android/app/release.keystore" -storepass "${{ secrets.STORE_PASSWORD || 'androidrelease123' }}" -alias "${{ secrets.KEY_ALIAS || 'mohalibanafa' }}" -keypass "${{ secrets.KEY_PASSWORD || 'androidrelease123' }}" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=mohalibanafa,O=mohalibanafa,C=SA"
          fi
          echo "KEYSTORE_PATH=${{ github.workspace }}/android/app/release.keystore" >> $GITHUB_ENV
          echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD || 'androidrelease123' }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD || 'androidrelease123' }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS || 'mohalibanafa' }}" >> $GITHUB_ENV

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/nball-v2.2.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: N-Ball-v2.2.0-APK
          path: android/app/build/outputs/apk/release/nball-v2.2.0.apk
          retention-days: 7

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.2.0"
          APK="android/app/build/outputs/apk/release/nball-v2.2.0.apk"

          # Re-create tag and release cleanly
          gh release delete $TAG --yes || true
          git tag -d $TAG 2>/dev/null || true
          git push origin :refs/tags/$TAG 2>/dev/null || true

          gh release create $TAG "$APK" \
            --title "N-Ball v2.2.0 - Android & Web Release" \
            --notes "## 🎮 N-Ball v2.2.0 (Official Release)

          ### المميزات الرئيسية:
          - 🕹️ **محرك فيزياء أصيل:** محاكاة دقيقة بسرعة 63.0 FPS مع استرخاء الشد والزنبركات المرنة ونقل الزخم.
          - 📱 **دعم أندرويد متكامل وشاشة كاملة (Fullscreen Landscape):** تجربة لعب غامرة بدون أي حواف سوداء.
          - 🎮 **أزرار تحكم مريحة باللمس (Multi-touch On-Screen Controls):** إمكانية الحركة والقفز معاً بدون تأخير.
          - 🎵 **الموسيقى الأصلية والمؤثرات الصوتية الفورية:** تعمل الموسيقى تلقائياً، مع صوت قفز بدون أي تأخير (0ms) عبر Web Audio API.
          - 🏁 **جميع المراحل الأربعين (40 Levels):** الحملات الأربعة كاملة (Campaigns 1-4) بجميع ألغازها وعرباتها وجسورها المعلقة.

          ---
          ### التحميل والتثبيت (Android APK):
          قم بتنزيل ملف **\`nball-v2.2.0.apk\`** المرفق بالأسفل وتثبيته مباشرة على جهاز الأندرويد الخاص بك."
