name: Build N-Ball Native Engine

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-native-linux:
    name: Build Native Engine (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install SDL2 & OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libgl1-mesa-dev

      - name: Configure CMake
        working-directory: nball_native
        run: cmake -B build -S .

      - name: Build Project
        working-directory: nball_native/build
        run: cmake --build . --config Release

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: nball-native-linux
          path: nball_native/build/nball_native
          retention-days: 14
